name: CN sampling notices

# Parses the notice pages the NAS has downloaded into cn_checks and prints the match report.
# With hk_from set, also loads Hong Kong CFS records from that year (one-off backfill).
on:
  workflow_dispatch:
    inputs:
      hk_from:
        description: "Also load Hong Kong records from this year (e.g. 2020). Leave empty to skip."
        required: false
        default: ""
      holds:
        description: "Sync the import hold lists (FDA red list, Australian holding orders) now (yes to run)."
        required: false
        default: ""
      kr_gdtbt:
        description: "Load Korea history from the Guangdong WTO/SPS monthly reports the NAS downloaded (yes to run)."
        required: false
        default: ""

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.cn_samr && python -m pipeline.cn_more
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: ${{ github.event.inputs.hk_from != '' }}
        run: |
          python - <<'PY'
          from pipeline import db, hk
          recs = hk.fetch(int("${{ github.event.inputs.hk_from }}"), known=db.ids("HK"))
          n = db.upsert(recs) if recs else 0
          db.log_run("HK", len(recs), n, "ok", "backfill")
          print("HK stored", n)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
      - if: ${{ github.event.inputs.kr_gdtbt == 'yes' }}
        run: |
          python -m pipeline.kr_gdtbt
          python - <<'PY'
          from pipeline import db
          import requests
          r = requests.post(db.URL + "/rest/v1/rpc/refresh_firm_all", headers=db._h(), json={}, timeout=300)
          print("refresh_firm_all", r.status_code)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
      - if: ${{ github.event.inputs.holds == 'yes' }}
        run: python -c "from pipeline import holds; holds.run()"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
