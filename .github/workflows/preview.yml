name: Preview new sources (dry run)

# Runs only on preview/* branches. Fetches and parses new sources, writes nothing to the
# database, and uploads the parsed rows as an artifact for review.
on:
  push:
    branches: ["preview/**"]

jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.holds --dry-jpkr && mkdir -p out && mv holds_jpkr.json out/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FDA_USER: ${{ secrets.FDA_USER }}
          FDA_KEY: ${{ secrets.FDA_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
